name: build-apk

# This exists because the project was developed somewhere with no JDK and no
# Android SDK: the APK cannot be produced locally, so the build runs here and
# the artifact is the thing you install.
#
# Every push to main builds and tests the app. A `v*` tag additionally attaches
# the APK to a GitHub Release, which can be downloaded without logging in --
# convenient when the phone is doing the downloading.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Runs on the JVM, no device: the sleep detector's eight scenarios and the
      # protocol suite. A red run here means the logic is wrong, which is worth
      # knowing before installing anything.
      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "sleepplayer-${GITHUB_SHA::7}.apk"
          ls -lh sleepplayer-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sleepplayer-apk
          path: sleepplayer-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sleepplayer-*.apk
          body: |
            Sleep guard APK, built from ${{ github.sha }}.

            Install: allow "install unknown apps" for your browser or file
            manager, copy the APK to the phone, tap it. It is a debug build,
            signed with the standard debug key -- installable, not publishable.
