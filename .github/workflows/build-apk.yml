name: build-apk

# The APK cannot be built in the environment this project was written in (no
# JDK, no Android SDK), so the build runs here and the output is what you
# install.
#
# Two ways to get the file, both without a local toolchain:
#
#   1. a permanent link that always points at the newest build
#        .../releases/download/build-latest/sleepplayer.apk
#   2. the Artifacts section of any individual run (needs a GitHub login)
#
# A `v*` tag additionally publishes a normal versioned release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Runs on the JVM, no device: the sleep detector's scenarios and the
      # protocol suite. Red here means the logic is wrong, which is worth
      # knowing before installing anything.
      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # A stable file name is the whole point: it makes the release asset URL
      # constant, so the link below never changes between builds.
      - name: Collect the APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sleepplayer.apk
          ls -lh sleepplayer.apk
          echo "SHA $GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: sleepplayer-apk
          path: sleepplayer.apk
          if-no-files-found: error
          retention-days: 30

      # Rolling release: always the same tag and asset name, so this link is
      # permanent and needs no login to download.
      - name: Publish latest build
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Latest build
          prerelease: true
          make_latest: 'false'
          overwrite_files: true
          files: sleepplayer.apk
          body: |
            Auto-built from `${{ github.sha }}`.

            **Direct download** (no login, works in a phone browser):

            https://github.com/${{ github.repository }}/releases/download/build-latest/sleepplayer.apk

            Debug build, signed with the standard debug key: installable, not
            publishable to an app store.

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sleepplayer.apk
